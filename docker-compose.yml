services:
  postgres:
    image: postgres:16-alpine
    container_name: rrhh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrhh_db
      POSTGRES_USER: rrhh_user
      POSTGRES_PASSWORD: rrhh_password
      TZ: Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh_user -d rrhh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
