<button
  mat-icon-button
  type="button"
  class="bell-button"
  [matMenuTriggerFor]="notificationsMenu"
  (menuOpened)="loadNotifications()"
  [attr.aria-label]="ariaLabel()">
  <mat-icon
    aria-hidden="true"
    [matBadge]="unreadCount()"
    [matBadgeHidden]="unreadCount() === 0"
    matBadgeColor="warn"
    matBadgeSize="small">notifications</mat-icon>
</button>

<mat-menu #notificationsMenu="matMenu" xPosition="before" class="notifications-menu">
  <div class="menu-header" (click)="$event.stopPropagation()">
    Notificaciones · {{ ariaLabel() }}
  </div>

  @if (loading()) {
    <div class="menu-empty" role="status">Cargando...</div>
  } @else if (notifications().length === 0) {
    <div class="menu-empty">No tienes notificaciones</div>
  } @else {
    @for (notification of notifications(); track notification.id) {
      <button mat-menu-item type="button" class="notification-item" [class.unread]="!notification.read" (click)="onSelect(notification)">
        <div class="notification-content">
          <span class="notification-title">
            @if (!notification.read) {
              <mat-icon class="unread-icon" aria-hidden="true">fiber_new</mat-icon>
              <span class="unread-label">Nueva</span>
            }
            {{ notification.title }}
          </span>
          <span class="notification-message">{{ notification.message }}</span>
          <span class="notification-date">{{ notification.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      </button>
    }
  }
</mat-menu>
