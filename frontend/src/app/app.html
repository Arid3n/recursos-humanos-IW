<header class="app-header">
  <div class="header-container">
    <a routerLink="/" class="brand">
      <span class="logo-icon">👥</span>
      <h1>Gestión de Recursos Humanos</h1>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-btn">Inicio</a>

      @if (authService.isAuthenticated()) {
        @if (authService.isRRHH()) {
          <a routerLink="/employees/new" routerLinkActive="active" class="nav-btn">Alta de Empleado</a>
        }

        <div class="user-profile">
          <div class="user-info">
            <span class="user-name">{{ authService.currentUser()?.username }}</span>
            <span class="role-badge" [attr.data-role]="authService.currentUser()?.role">
              {{ authService.currentUser()?.role }}
            </span>
          </div>
          <button (click)="onLogout()" class="logout-btn" title="Cerrar Sesión">
            <span class="logout-icon">🚪</span>
            <span>Salir</span>
          </button>
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="nav-btn login-nav-btn">Iniciar Sesión</a>
      }
    </nav>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
